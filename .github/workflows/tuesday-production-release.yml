name: Tuesday production release

on:
  schedule:
    - cron: "0 10 * * 2"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  promote-staging:
    name: Promote staging to main
    if: github.event_name == 'schedule' || github.actor == 'profbiyi'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.WEEKLY_RELEASE_SSH_KEY }}

      - name: Merge staging into production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CDE Weekly Release"
          git config user.email "release-bot@users.noreply.github.com"
          git fetch origin staging

          if git merge-base --is-ancestor origin/staging HEAD; then
            echo "Production already contains every staging commit."
            exit 0
          fi

          # Keep staging and main on the same commit after every release.
          # This intentionally fails instead of creating an unexpected merge
          # when production contains commits that are not in staging.
          git merge --ff-only origin/staging
          git push origin HEAD:main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Snowflake client
        run: pip install -r requirements-ci.txt

      - name: Deploy production views to Snowflake
        env:
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_DEPLOY_USER }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_DEPLOY_ROLE }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_DEPLOY_PRIVATE_KEY }}
        run: python scripts/run_snowflake_sql.py deploy
