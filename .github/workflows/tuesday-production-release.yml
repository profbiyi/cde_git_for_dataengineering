name: Tuesday production release

on:
  schedule:
    - cron: "0 10 * * 2"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  promote-staging:
    name: Promote staging to main
    # Scheduled releases run automatically once. Any manual run or re-run must
    # be initiated by profbiyi; github.actor alone is unsafe for re-runs because
    # it remains the actor from the original run.
    if: >-
      (github.event_name == 'schedule' &&
       (github.run_attempt == 1 || github.triggering_actor == 'profbiyi')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor == 'profbiyi' &&
       github.triggering_actor == 'profbiyi')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out production branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.WEEKLY_RELEASE_SSH_KEY }}

      - name: Prepare the exact staging release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin staging
          git merge --ff-only origin/staging

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      - name: Validate and deploy production views atomically
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_DEPLOY_URL }}
        run: python scripts/run_postgres_sql.py deploy --schema analytics

      - name: Advance main only after successful deployment
        run: git push origin HEAD:main
