name: SQL validation

on:
  pull_request:
    branches: [staging]

permissions:
  contents: read

# One hosted validation at a time keeps the free database connection load low.
concurrency:
  group: hosted-postgres-validation
  cancel-in-progress: false

jobs:
  validate-sql:
    name: Validate PostgreSQL SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fork PRs have no repository secrets. Instructor must review/import them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      DATABASE_URL: ${{ secrets.POSTGRES_CI_URL }}
      CI_SCHEMA: ci_pr_${{ github.event.pull_request.number }}_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Build views and run data tests in a temporary schema
        run: python scripts/run_postgres_sql.py validate
