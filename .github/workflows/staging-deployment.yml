name: Deploy staging

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: postgres-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.POSTGRES_DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python scripts/run_postgres_sql.py deploy --schema staging
